name: Liftoff CLI Project Setup

on:
  workflow_dispatch:
    inputs:
      # --- Platforms ---
      platform:
        description: "Select target platform"
        required: true
        type: choice
        options:
          - Android
          - Core
          - GWT
          - Headless
          - IOS
          - IOSMOE
          - Lwjgl2
          - Lwjgl3
          - Server
          - Shared
          - TeaVM

      # --- Languages ---
      language:
        description: "Select programming language"
        required: true
        type: choice
        options:
          - Kotlin
          - Groovy
          - Scala

      # --- Templates ---
      template:
        description: "Select project template"
        required: true
        type: choice
        options:
          - ClassicTemplate
          - ApplicationAdapterTemplate
          - ApplicationListenerTemplate
          - EmptyTemplate
          - GameTemplate
          - InputProcessorTemplate
          - KotlinBasicTemplate
          - KotlinClassicTemplate
          - Scene2DTemplate
          - SuperKoalioTemplate
          - IsometricVoxelTemplate
          - AutumnMvcBasicTemplate
          - AutumnMvcBox2dTemplate
          - AutumnMvcVisTemplate
          - KiwiInputTemplate
          - KiwiTemplate
          - KtxTemplate
          - LmlTemplate
          - Noise4JTemplate
          - VisUIBasicTemplate
          - VisUIShowcaseTemplate

      # --- Official Libraries (booleans) ---
      AI:
        description: "Include AI library?"
        required: false
        default: true
        type: boolean
      Ashley:
        description: "Include Ashley library?"
        required: false
        default: true
        type: boolean
      Box2D:
        description: "Include Box2D library?"
        required: false
        default: true
        type: boolean
      Box2DLights:
        description: "Include Box2DLights library?"
        required: false
        default: true
        type: boolean
      Bullet:
        description: "Include Bullet library?"
        required: false
        default: true
        type: boolean
      Controllers:
        description: "Include Controllers library?"
        required: false
        default: true
        type: boolean
      Freetype:
        description: "Include Freetype library?"
        required: false
        default: true
        type: boolean
      Tools:
        description: "Include Tools library?"
        required: false
        default: true
        type: boolean

      # --- Unofficial Libraries (comma-separated) ---
      unofficial_libs:
        description: "Add unofficial libraries (comma-separated IDs)"
        required: false
        default: ""
        type: string

      # --- Optional Flags ---
      headless:
        description: "Run in headless mode?"
        required: false
        default: false
        type: boolean
      debug:
        description: "Enable debug mode?"
        required: false
        default: false
        type: boolean

jobs:
  liftoff_cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build CLI command
        id: build_command
        run: |
          CMD="java -jar liftoff-cli.jar"
          CMD="$CMD --platform ${{ github.event.inputs.platform }}"
          CMD="$CMD --language ${{ github.event.inputs.language }}"
          CMD="$CMD --template ${{ github.event.inputs.template }}"

          # Add official libraries if enabled
          for lib in AI Ashley Box2D Box2DLights Bullet Controllers Freetype Tools; do
            VAL="${{ github.event.inputs[lib] }}"
            if [ "$VAL" = "true" ]; then
              CMD="$CMD --libs $lib"
            fi
          done

          # Add unofficial libraries
          if [ -n "${{ github.event.inputs.unofficial_libs }}" ]; then
            CMD="$CMD --libs ${{ github.event.inputs.unofficial_libs }}"
          fi

          # Add flags
          if [ "${{ github.event.inputs.headless }}" = "true" ]; then
            CMD="$CMD --headless"
          fi
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            CMD="$CMD --debug"
          fi

          echo "CLI_COMMAND=$CMD" >> $GITHUB_ENV

      - name: Run Liftoff CLI
        run: |
          echo "Executing Liftoff CLI..."
          echo $CLI_COMMAND
          eval $CLI_COMMAND