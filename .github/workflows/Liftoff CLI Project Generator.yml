name: Liftoff LibGDX CLI

on:
  workflow_dispatch:
    inputs:
      projectName:
        description: 'Nome do projeto'
        required: true
        default: 'MyLibGDXProject'
      packageName:
        description: 'Pacote base do projeto'
        required: true
        default: 'com.yourcompany.liftoff'
      mainClassName:
        description: 'Nome da classe principal'
        required: true
        default: 'Main'
      projectPath:
        description: 'Caminho do projeto'
        required: false
        default: './'
      platforms:
        description: 'Plataformas separadas por vírgula'
        required: false
        default: 'core,desktop,android'
      extensions:
        description: 'Extensões separadas por vírgula'
        required: false
        default: ''
      addReadme:
        description: 'Adicionar README?'
        required: false
        default: 'true'
      addGuiAssets:
        description: 'Adicionar assets GUI?'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and run MainCli
        run: |
          java -cp . com.yourcompany.liftoff.MainCli \
            --projectName=${{ github.event.inputs.projectName }} \
            --packageName=${{ github.event.inputs.packageName }} \
            --mainClassName=${{ github.event.inputs.mainClassName }} \
            --projectPath=${{ github.event.inputs.projectPath }} \
            --platforms=${{ github.event.inputs.platforms }} \
            --extensions=${{ github.event.inputs.extensions }} \
            --addReadme=${{ github.event.inputs.addReadme }} \
            --addGuiAssets=${{ github.event.inputs.addGuiAssets }}