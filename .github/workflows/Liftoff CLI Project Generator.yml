name: Liftoff Project CLI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Escolha a branch para executar o workflow"
        required: true
        default: "development"
      projectName:
        description: "Nome do projeto"
        required: true
        default: "MyGame"
      packageName:
        description: "Pacote Java"
        required: true
        default: "com.example.mygame"
      mainClassName:
        description: "Classe principal"
        required: true
        default: "MainGame"
      projectPath:
        description: "Caminho do projeto"
        required: true
        default: "./"
      androidPath:
        description: "Caminho do Android"
        required: false
        default: "./android"
      libgdxVersion:
        description: "Versão do LibGDX"
        required: true
        default: "1.12.0"
      javaVersion:
        description: "Versão do Java"
        required: true
        default: "17"
      appVersion:
        description: "Versão do App"
        required: true
        default: "1.0"
      gwtPluginVersion:
        description: "Versão do plugin GWT"
        required: true
        default: "2.9.0"
      platforms:
        description: "Plataformas (separadas por vírgula)"
        required: false
        default: "desktop,android"
      extensions:
        description: "Extensões (separadas por vírgula)"
        required: false
        default: ""
      thirdPartyLibs:
        description: "Bibliotecas de terceiros (separadas por vírgula)"
        required: false
        default: ""
      addReadme:
        description: "Adicionar README? true/false"
        required: false
        default: "true"
      addGuiAssets:
        description: "Adicionar GUI Assets? true/false"
        required: false
        default: "true"
      gradleTasks:
        description: "Tarefas Gradle (separadas por vírgula)"
        required: false
        default: "clean,build"

jobs:
  liftoff-cli:
    name: Executar Liftoff CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ github.event.inputs.javaVersion }}

      - name: Build project classes (se necessário)
        run: |
          # Se precisar compilar classes antes de rodar o MainCli
          javac -d ./classes ./src/gdx/liftoff/*.java

      - name: Run Liftoff CLI
        run: |
          java -cp ./classes gdx.liftoff.MainCli \
            --projectName="${{ github.event.inputs.projectName }}" \
            --packageName="${{ github.event.inputs.packageName }}" \
            --mainClassName="${{ github.event.inputs.mainClassName }}" \
            --projectPath="${{ github.event.inputs.projectPath }}" \
            --androidPath="${{ github.event.inputs.androidPath }}" \
            --libgdxVersion="${{ github.event.inputs.libgdxVersion }}" \
            --javaVersion="${{ github.event.inputs.javaVersion }}" \
            --appVersion="${{ github.event.inputs.appVersion }}" \
            --gwtPluginVersion="${{ github.event.inputs.gwtPluginVersion }}" \
            --platforms="${{ github.event.inputs.platforms }}" \
            --extensions="${{ github.event.inputs.extensions }}" \
            --thirdPartyLibs="${{ github.event.inputs.thirdPartyLibs }}" \
            --addReadme="${{ github.event.inputs.addReadme }}" \
            --addGuiAssets="${{ github.event.inputs.addGuiAssets }}" \
            --gradleTasks="${{ github.event.inputs.gradleTasks }}"

      - name: Upload Liftoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: liftoff-project
          path: ${{ github.event.inputs.projectPath }}