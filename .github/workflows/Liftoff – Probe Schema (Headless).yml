name: Liftoff – Probe Schema (Headless)

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/liftoff-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Build Liftoff (headless)
        run: ./gradlew clean build -x test

      # Executa o CLI diretamente do distribution gerado pelo Gradle
      - name: Run Liftoff CLI – probe schema
        run: |
          mkdir -p out
          ./build/install/gdx-liftoff/bin/gdx-liftoff \
            dump schema \
            --output out/liftoff-schema.json

      # Falha explícita se o artefato NÃO existir
      - name: Verify probe artifact
        run: |
          if [ ! -f out/liftoff-schema.json ]; then
            echo "❌ liftoff-schema.json was not generated"
            exit 1
          fi
          echo "✅ liftoff-schema.json generated successfully"

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: liftoff-schema
          path: out/liftoff-schema.json