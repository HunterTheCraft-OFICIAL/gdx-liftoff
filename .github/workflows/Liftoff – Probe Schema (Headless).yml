name: Liftoff – Probe Schema (Headless)

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/liftoff-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Build Liftoff (no UI)
        run: ./gradlew clean build -x test

      - name: Run Liftoff CLI – dump schema
        run: |
          mkdir -p out
          java -cp build/classes/java/main:build/classes/kotlin/main gdx.liftoff.LiftoffCli dump schema > out/liftoff-schema.json

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: liftoff-schema
          path: out/liftoff-schema.json