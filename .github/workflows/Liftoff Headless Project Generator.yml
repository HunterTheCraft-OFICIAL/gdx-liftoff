name: Liftoff Headless Project Generator

on:
  workflow_dispatch:
    inputs:
      projectName:
        description: "Enter the project name"
        required: true
        default: "MyGame"
      packageName:
        description: "Enter the project package name"
        required: true
        default: "com.mygame"
      platforms:
        description: "Select target platforms (multiple allowed)"
        required: true
        default: "Android,Desktop"
        type: choice
        options:
          - Android
          - Desktop
          - GWT
          - iOS
          - iOSMOE
          - Headless
          - Shared
          - TeaVM
      language:
        description: "Select programming language (single choice)"
        required: true
        default: "Kotlin"
        type: choice
        options:
          - Kotlin
          - Groovy
          - Scala
      officialLibs:
        description: "Select official libraries to include (multiple allowed)"
        required: false
        default: "AI,Ashley,Box2D,Box2DLights,Bullet,Controllers,Freetype,Tools"
        type: choice
        options:
          - AI
          - Ashley
          - Box2D
          - Box2DLights
          - Bullet
          - Controllers
          - Freetype
          - Tools
      unofficialLibs:
        description: "Enter unofficial libraries (IDs separated by comma)"
        required: false
        default: ""
      headless:
        description: "Enable Headless (CLI) mode – mandatory"
        required: true
        default: "true"
        type: boolean
      debug:
        description: "Enable debug mode"
        required: false
        default: "false"
        type: boolean

jobs:
  generate_project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build Liftoff JAR
        run: ./gradlew clean shadowJar

      - name: Run Headless CLI
        run: |
          java -cp build/libs/liftoff.jar gdx.liftoff.MainHeadless \
            --projectName="${{ github.event.inputs.projectName }}" \
            --packageName="${{ github.event.inputs.packageName }}" \
            --platforms="${{ github.event.inputs.platforms }}" \
            --language="${{ github.event.inputs.language }}" \
            --officialLibs="${{ github.event.inputs.officialLibs }}" \
            --unofficialLibs="${{ github.event.inputs.unofficialLibs }}" \
            --headless="${{ github.event.inputs.headless }}" \
            --debug="${{ github.event.inputs.debug }}"

      - name: Upload Liftoff JAR
        uses: actions/upload-artifact@v4
        with:
          name: liftoff-jar
          path: build/libs/liftoff.jar